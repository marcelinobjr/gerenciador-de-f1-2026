<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Toyota Dual Inner Ellipses forming T in Roundel -->
  <circle cx="50" cy="50" r="46" fill="#CC0000" />
  <!-- Outer Ellipse -->
  <ellipse cx="50" cy="50" rx="38" ry="28" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  <!-- Vertical Ellipse (forms center stem of T) -->
  <ellipse cx="50" cy="46" rx="14" ry="26" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  <!-- Horizontal Top Ellipse (forms crossbar of T) -->
  <ellipse cx="50" cy="36" rx="26" ry="12" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
</svg>
