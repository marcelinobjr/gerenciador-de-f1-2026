<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" width="140" height="90">
  <!-- Cadillac Crest Official Geometric Design -->
  <!-- Wreath/Wings styling -->
  <g fill="#D4AF37" stroke="#111111" stroke-width="0.5">
    <!-- Top Central Crest Bar -->
    <path d="M40 25 L100 25 L92 38 L48 38 Z" fill="#D4AF37" />
    <!-- Color mosaic cells inside Cadillac crest -->
    <rect x="52" y="27" width="10" height="8" fill="#C4122F" />
    <rect x="65" y="27" width="10" height="8" fill="#1E2A5A" />
    <rect x="78" y="27" width="10" height="8" fill="#D4AF37" />
    <!-- Center lower shield -->
    <path d="M46 40 L94 40 L70 72 Z" fill="#D4AF37" />
    <polygon points="54,42 86,42 70,64" fill="#111111" />
    <polygon points="60,44 80,44 70,58" fill="#D4AF37" />
  </g>
  <text x="70" y="84" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="8" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">CADILLAC</text>
</svg>
