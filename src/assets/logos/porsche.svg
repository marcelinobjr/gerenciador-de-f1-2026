<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Porsche Crest Shield -->
  <path d="M14 15 L86 15 C86 55 75 90 50 110 C25 90 14 55 14 15 Z" fill="#D4AF37" stroke="#111111" stroke-width="2" />
  <!-- Quarters: Red/Black stripes and Antlers -->
  <!-- Top left quarter: Antlers -->
  <rect x="20" y="24" width="28" height="32" fill="#D4AF37" stroke="#111111" stroke-width="1" />
  <line x1="24" y1="32" x2="44" y2="32" stroke="#111111" stroke-width="2" />
  <line x1="24" y1="40" x2="44" y2="40" stroke="#111111" stroke-width="2" />
  <line x1="24" y1="48" x2="44" y2="48" stroke="#111111" stroke-width="2" />
  <!-- Top right quarter: Red & Black Stripes -->
  <rect x="52" y="24" width="28" height="32" fill="#111111" stroke="#111111" stroke-width="1" />
  <rect x="52" y="30" width="28" height="6" fill="#B12B00" />
  <rect x="52" y="44" width="28" height="6" fill="#B12B00" />
  <!-- Bottom left quarter: Red & Black Stripes -->
  <rect x="20" y="60" width="28" height="32" fill="#111111" stroke="#111111" stroke-width="1" />
  <rect x="20" y="66" width="28" height="6" fill="#B12B00" />
  <rect x="20" y="80" width="28" height="6" fill="#B12B00" />
  <!-- Bottom right quarter: Antlers -->
  <rect x="52" y="60" width="28" height="32" fill="#D4AF37" stroke="#111111" stroke-width="1" />
  <line x1="56" y1="68" x2="76" y2="68" stroke="#111111" stroke-width="2" />
  <line x1="56" y1="76" x2="76" y2="76" stroke="#111111" stroke-width="2" />
  <line x1="56" y1="84" x2="76" y2="84" stroke="#111111" stroke-width="2" />
  <!-- Center Inescutcheon: Stuttgart Horse -->
  <rect x="42" y="46" width="16" height="22" rx="3" fill="#D4AF37" stroke="#111111" stroke-width="1.5" />
  <circle cx="50" cy="54" r="3" fill="#111111" />
  <path d="M49 57 L51 57 L52 64 L48 64 Z" fill="#111111" />
  <!-- Top Banner Text PORSCHE -->
  <text x="50" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="7" fill="#111111" text-anchor="middle" letter-spacing="1">PORSCHE</text>
</svg>
