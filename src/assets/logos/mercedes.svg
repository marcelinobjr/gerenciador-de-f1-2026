<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Mercedes-Benz Three-Pointed Star -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#00D2BE" stroke-width="4.5" />
  <!-- Center Star Facets -->
  <g fill="#00D2BE">
    <!-- Top point -->
    <polygon points="50,12 50,50 44,48" opacity="0.9" />
    <polygon points="50,12 50,50 56,48" opacity="0.6" />
    <!-- Bottom right point -->
    <polygon points="83,69 50,50 54,44" opacity="0.9" />
    <polygon points="83,69 50,50 47,55" opacity="0.6" />
    <!-- Bottom left point -->
    <polygon points="17,69 50,50 46,44" opacity="0.6" />
    <polygon points="17,69 50,50 53,55" opacity="0.9" />
  </g>
  <circle cx="50" cy="50" r="4" fill="#00D2BE" />
</svg>
